name: Verify PetCare

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated backend and frontend tests
        run: npm test
      - name: Check backend entrypoint syntax
        run: node --check admin-backend/render-api/server.cjs
      - name: Build Vite frontend
        run: npm run build
