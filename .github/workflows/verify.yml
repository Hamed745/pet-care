name: Verify PetCare

on:
  pull_request:
  push:
    branches:
      - main
      - feature/petcaree-complete-update-20261116

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix admin-backend/render-api
      - name: Run isolated backend and frontend tests
        run: npm test
      - name: Check backend entrypoint syntax
        run: node --check admin-backend/render-api/server.cjs
      - name: Build Vite frontend
        run: npm run build
      - name: Prepare isolated demo-petcare config
        run: |
          printf '%s\n' \
            'PETCARE_USE_FIREBASE_EMULATORS=true' \
            'FIREBASE_PROJECT_ID=demo-petcare' \
            'FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099' \
            'FIRESTORE_EMULATOR_HOST=127.0.0.1:8080' \
            'VITE_FIREBASE_EMULATOR_ENABLED=true' \
            'VITE_FIREBASE_PROJECT_ID=demo-petcare' \
            'VITE_FIREBASE_API_KEY=demo-api-key' \
            'VITE_FIREBASE_AUTH_DOMAIN=demo-petcare.firebaseapp.com' \
            'VITE_FIREBASE_STORAGE_BUCKET=demo-petcare.appspot.com' \
            'VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000' \
            'VITE_FIREBASE_APP_ID=1:000000000000:web:demo' \
            'VITE_FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1' \
            'VITE_FIREBASE_AUTH_EMULATOR_PORT=9099' \
            'VITE_FIRESTORE_EMULATOR_HOST=127.0.0.1' \
            'VITE_FIRESTORE_EMULATOR_PORT=8080' > .env.emulator.local
          : > admin-backend/render-api/.env.supabase.local
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify clinic onboarding, admin review and bookings in browser
        run: npm run test:browser
